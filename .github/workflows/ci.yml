name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - working-directory: apps/api
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings=0
      - run: pnpm typecheck
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:3000/ -o /tmp/arisanly.html
          grep -q Arisanly /tmp/arisanly.html
          docker compose exec -T db psql -U arisanly -d arisanly -Atc "SELECT schema_name FROM information_schema.schemata WHERE schema_name = 'arisanly'" | grep -Fx arisanly
      - run: node scripts/auth-smoke.mjs
      - run: node scripts/groups-smoke.mjs
      - run: node scripts/arisan-smoke.mjs
        env:
          ARISAN_CONCURRENCY: "100"
      - working-directory: apps/api
        env:
          HARDENING_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test -race -count=1 -v ./internal/hardening
      - run: node scripts/rate-limit-smoke.mjs
      - run: node scripts/kas-smoke.mjs
      - name: Verify PostgreSQL fallback without Redis
        run: |
          docker compose stop redis
          node scripts/arisan-smoke.mjs
      - working-directory: apps/api
        env:
          LEDGER_TEST_DATABASE_URL: postgres://arisanly:arisanly_local@127.0.0.1:5432/arisanly?sslmode=disable
        run: go test -race -count=1 -v ./internal/ledger ./internal/reminders
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start HTTPS stack
        run: |
          umask 077
          cp deploy/.env.example .env.production
          cat >> .env.production <<ENV
          ARISANLY_DOMAIN=localhost
          ARISANLY_JWT_SECRET=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          ENV
          compose=(docker compose --env-file .env.production -f docker-compose.yml -f deploy/compose.yml)
          "${compose[@]}" config --format json | jq -e '
            [.services | to_entries[] | select((.value.ports // []) | length > 0) | .key] == ["proxy"]
            and (.services.proxy.ports | map(.target) | sort) == [80,443]
            and .services.api.environment.AUTH_COOKIE_SECURE == "true"
          ' >/dev/null
          "${compose[@]}" up --build --detach --wait --wait-timeout 120
          for attempt in {1..30}; do
            if "${compose[@]}" cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/arisanly-root.crt; then break; fi
            sleep 1
          done
          test -s /tmp/arisanly-root.crt
          curl --fail --silent --show-error --retry 10 --retry-connrefused --cacert /tmp/arisanly-root.crt https://localhost/readyz
      - name: Verify public routes and demo workflow
        env:
          ARISANLY_WEB_URL: https://localhost
          NODE_EXTRA_CA_CERTS: /tmp/arisanly-root.crt
        run: |
          node scripts/release-smoke.mjs
          node scripts/seed-demo.mjs
      - if: failure()
        run: docker compose --env-file .env.production -f docker-compose.yml -f deploy/compose.yml logs
      - if: always()
        run: docker compose --env-file .env.production -f docker-compose.yml -f deploy/compose.yml down --volumes

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - working-directory: apps/api
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings=0
      - run: pnpm typecheck
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:3000/ -o /tmp/arisanly.html
          grep -q Arisanly /tmp/arisanly.html
          docker compose exec -T db psql -U arisanly -d arisanly -Atc "SELECT schema_name FROM information_schema.schemata WHERE schema_name = 'arisanly'" | grep -Fx arisanly
      - run: node scripts/auth-smoke.mjs
      - run: node scripts/groups-smoke.mjs
      - run: node scripts/arisan-smoke.mjs
      - working-directory: apps/api
        env:
          LEDGER_TEST_DATABASE_URL: postgres://arisanly:arisanly_local@127.0.0.1:5432/arisanly?sslmode=disable
        run: go test -race -count=1 -v ./internal/ledger
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
